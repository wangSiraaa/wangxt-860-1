version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: milestone-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: milestone_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - milestone-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: milestone-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/milestone_db?schema=public
      JWT_SECRET: milestone-super-secret-key-2024
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - milestone-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: milestone-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - milestone-network

volumes:
  postgres_data:

networks:
  milestone-network:
    driver: bridge
